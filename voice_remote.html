<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedVoice">
<title>MedVoice Remote</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;700;900&display=swap');
:root {
  --bg:#080c10;--s1:#0e1318;--s2:#141b22;--border:#1e2830;
  --accent:#0af0c0;--warn:#f0a80a;--danger:#f04040;
  --text:#d8e4ec;--muted:#4a5a68;--green:#0af0a0;
  --mono:'DM Mono',monospace;--sans:'Zen Kaku Gothic New',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column;height:100dvh;}

.tab-bar{display:flex;background:var(--s1);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px);flex-shrink:0;}
.tab-btn{flex:1;background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:14px 0 12px;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;text-transform:uppercase;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

.page{display:none;flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px env(safe-area-inset-bottom,20px);}
.page.active{display:flex;flex-direction:column;gap:18px;}

.card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px;}
.card-label{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}

.conn-row{display:flex;gap:8px;align-items:center;}
.conn-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;padding:9px 12px;outline:none;transition:border-color .2s;}
.conn-input:focus{border-color:var(--accent);}
.btn-sm{background:var(--accent);color:#000;border:none;border-radius:8px;font-family:var(--mono);font-size:11px;font-weight:500;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:opacity .15s;}
.btn-sm:active{opacity:.7;}
.conn-status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 6px var(--danger);flex-shrink:0;transition:background .3s,box-shadow .3s;}
#status-dot.on{background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

#transcript-box{min-height:80px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
#transcript-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .3s;}
#transcript-box.active::after{opacity:1;animation:scan 1.4s linear infinite;}
@keyframes scan{from{transform:translateX(-100%);}to{transform:translateX(100%);}}
#transcript-txt{font-size:26px;font-weight:900;text-align:center;word-break:break-all;line-height:1.2;transition:color .2s;}
#transcript-txt.ph{font-size:14px;font-weight:300;color:var(--muted);}
#transcript-txt.interim{color:var(--accent);}
#transcript-txt.matched{color:var(--green);}
#transcript-txt.nomatch{color:var(--danger);}

#waveform{display:flex;align-items:center;justify-content:center;gap:4px;height:36px;opacity:0;transition:opacity .3s;}
#waveform.active{opacity:1;}
.wbar{width:3px;background:var(--accent);border-radius:3px;animation:wv 1s ease-in-out infinite;}
.wbar:nth-child(1){animation-delay:0s;}.wbar:nth-child(2){animation-delay:.09s;}.wbar:nth-child(3){animation-delay:.18s;}
.wbar:nth-child(4){animation-delay:.27s;}.wbar:nth-child(5){animation-delay:.18s;}.wbar:nth-child(6){animation-delay:.09s;}.wbar:nth-child(7){animation-delay:0s;}
@keyframes wv{0%,100%{height:5px;}50%{height:30px;}}

.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
#mic-btn{width:110px;height:110px;border-radius:50%;border:none;background:var(--s2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;-webkit-user-select:none;user-select:none;transition:transform .1s;}
#mic-btn::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--accent),#0a6050,var(--accent));opacity:.35;transition:opacity .3s,inset .3s;}
#mic-btn::after{content:'';position:absolute;inset:2px;border-radius:50%;background:var(--s2);}
#mic-btn .inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
#mic-icon{font-size:36px;line-height:1;}
#mic-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
#mic-btn.rec::before{opacity:1;inset:-6px;background:conic-gradient(var(--danger),#800,var(--danger));animation:rspin 1.5s linear infinite;}
@keyframes rspin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
#mic-btn:active{transform:scale(.93);}
.mic-hint{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;}
#feedback{font-family:var(--mono);font-size:12px;letter-spacing:.08em;height:18px;text-align:center;opacity:0;transition:opacity .25s;}
#feedback.show{opacity:1;}

#log{display:flex;flex-direction:column;gap:6px;}
.log-row{display:flex;align-items:center;gap:8px;font-size:13px;animation:fi .3s forwards;opacity:0;}
@keyframes fi{to{opacity:1;}}
.lt{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0;}
.lw{color:var(--accent);font-weight:700;}
.ls-ok{color:var(--green);font-size:11px;}
.ls-ng{color:var(--danger);font-size:11px;}

/* WORD CARDS */
.word-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.word-card-header{display:flex;align-items:center;gap:10px;padding:14px 14px 14px 16px;cursor:pointer;}
.wch-name{flex:1;font-size:17px;font-weight:900;letter-spacing:.04em;}
.cat-badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#000;border-radius:4px;padding:2px 7px;background:var(--accent);text-transform:uppercase;flex-shrink:0;}
.cat-badge.rec{background:var(--warn);}
.del-word-btn{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 4px;flex-shrink:0;}
.del-word-btn:active{color:var(--danger);}
.toggle-icon{color:var(--muted);font-size:13px;flex-shrink:0;transition:transform .2s;}
.toggle-icon.open{transform:rotate(180deg);}

.pattern-area{display:none;border-top:1px solid var(--border);padding:12px 14px;background:var(--s2);}
.pattern-area.open{display:block;}
.pattern-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.pattern-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:10px;}
.pattern-chip{display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 12px;font-size:13px;}
.main-chip{color:var(--accent);font-family:var(--mono);font-size:10px;}
.del-pat-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:0 2px;line-height:1;}
.del-pat-btn:active{color:var(--danger);}
.pattern-add-row{display:flex;gap:8px;}
.pattern-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:14px;padding:8px 10px;outline:none;transition:border-color .2s;}
.pattern-input:focus{border-color:var(--accent);}
.btn-xs{background:var(--accent);color:#000;border:none;border-radius:8px;font-family:var(--mono);font-size:11px;font-weight:500;padding:8px 12px;cursor:pointer;white-space:nowrap;}
.btn-xs:active{opacity:.7;}

.add-word-form{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px;}
.add-row{display:flex;gap:8px;margin-bottom:8px;}
.add-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:15px;padding:10px 12px;outline:none;transition:border-color .2s;}
.add-row input:focus{border-color:var(--accent);}
.cat-select{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:14px;padding:10px 8px;outline:none;}
.btn-full{width:100%;background:var(--accent);color:#000;border:none;border-radius:10px;font-family:var(--mono);font-size:13px;font-weight:500;padding:13px;cursor:pointer;letter-spacing:.06em;transition:opacity .2s;margin-bottom:8px;display:block;}
.btn-full:active{opacity:.7;}
.btn-full.danger{background:var(--danger);color:#fff;}
.btn-full.outline{background:none;border:1px solid var(--border);color:var(--muted);}
.section-title{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.empty-note{font-size:13px;color:var(--muted);text-align:center;padding:16px;}

.setting-row{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.setting-row label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}
.setting-row select{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 12px;outline:none;width:100%;}
.info-box{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.9;color:var(--muted);}
.info-box b{color:var(--accent);}
.info-box code{color:var(--text);background:var(--bg);padding:1px 5px;border-radius:4px;}
</style>
</head>
<body>

<div class="tab-bar">
  <button class="tab-btn active" onclick="showTab('home')">🎤 音声</button>
  <button class="tab-btn" onclick="showTab('words')">📋 ワード</button>
  <button class="tab-btn" onclick="showTab('settings')">⚙ 設定</button>
</div>

<!-- HOME -->
<div id="page-home" class="page active">
  <div class="card">
    <div class="card-label">接続先</div>
    <div class="conn-row">
      <input class="conn-input" id="ws-input" type="text" placeholder="wss://xxxx.ngrok-free.app" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn-sm" onclick="connectWS()">接続</button>
    </div>
    <div class="conn-status">
      <div id="status-dot"></div>
      <span id="status-txt">未接続</span>
    </div>
  </div>

  <div class="card" id="transcript-box">
    <span id="transcript-txt" class="ph">長押しで録音開始</span>
  </div>

  <div id="waveform">
    <div class="wbar"></div><div class="wbar"></div><div class="wbar"></div>
    <div class="wbar"></div><div class="wbar"></div><div class="wbar"></div>
    <div class="wbar"></div>
  </div>

  <div class="mic-wrap">
    <button id="mic-btn"
      onpointerdown="recStart(event)"
      onpointerup="recStop(event)"
      onpointerleave="recStop(event)"
      oncontextmenu="return false">
      <div class="inner">
        <span id="mic-icon">🎤</span>
        <span id="mic-lbl">HOLD</span>
      </div>
    </button>
    <div class="mic-hint">長押しで録音 / 離すと判定・送信</div>
  </div>

  <div id="feedback"></div>

  <div class="card">
    <div class="card-label">送信ログ</div>
    <div id="log"></div>
  </div>
</div>

<!-- WORDS -->
<div id="page-words" class="page">
  <div class="add-word-form">
    <div class="card-label">ワード追加</div>
    <div class="add-row">
      <input id="new-word" type="text" placeholder="送信ワード例：挿管" maxlength="30">
      <select class="cat-select" id="new-cat">
        <option value="med">🏥</option>
        <option value="rec">📝</option>
      </select>
    </div>
    <button class="btn-full" onclick="addWord()">＋ 追加</button>
  </div>
  <div>
    <div class="section-title">🏥 医療ワード</div>
    <div id="list-med"></div>
  </div>
  <div>
    <div class="section-title">📝 記録ワード</div>
    <div id="list-rec"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="page-settings" class="page">
  <div class="card">
    <div class="card-label">接続方法</div>
    <div class="info-box">
      <b>同一Wi-Fi</b><br>
      <code>ws://ラズパイIP:8765</code><br><br>
      <b>外出先（ngrok）</b><br>
      <code>ngrok tcp 8765</code><br>
      → <code>ws://x.tcp.ngrok.io:XXXXX</code><br><br>
      <b>HTTPS環境</b><br>
      <code>ngrok http 8765</code><br>
      → <code>wss://xxx.ngrok-free.app</code>
    </div>
  </div>
  <div class="card">
    <div class="card-label">マッチング</div>
    <div class="setting-row">
      <label>一致モード</label>
      <select id="match-mode">
        <option value="partial">部分一致（推奨）</option>
        <option value="exact">完全一致のみ</option>
      </select>
    </div>
  </div>
  <div class="card">
    <div class="card-label">データ管理</div>
    <button class="btn-full" onclick="exportData()">💾 エクスポート</button>
    <button class="btn-full outline" onclick="importClick()">📂 インポート</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn-full danger" onclick="resetWords()">🗑 デフォルトに戻す</button>
  </div>
  <div class="card">
    <div class="card-label">アプリ情報</div>
    <div class="info-box">
      <b>MedVoice Remote v3.0</b><br>
      音声認識 → パターンマッチ → 送信<br><br>
      Safari → 共有 → ホーム画面に追加
    </div>
  </div>
</div>

<script>
// ─── HELPERS（先に定義） ──────────────────────────────
function uid(){
  return Math.random().toString(36).slice(2,9);
}
function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function flashEl(el){ el.style.borderColor='var(--danger)'; setTimeout(function(){ el.style.borderColor=''; },1200); }

// ─── DEFAULT WORDS ────────────────────────────────────
function makeDefaultWords(){
  return [
    {id:uid(),word:'挿管',      cat:'med',patterns:['挿管','そうかん','送還','早管']},
    {id:uid(),word:'抜管',      cat:'med',patterns:['抜管','ばっかん','抜缶']},
    {id:uid(),word:'心停止',    cat:'med',patterns:['心停止','しんていし']},
    {id:uid(),word:'除細動',    cat:'med',patterns:['除細動','じょさいどう']},
    {id:uid(),word:'採血',      cat:'med',patterns:['採血','さいけつ']},
    {id:uid(),word:'点滴',      cat:'med',patterns:['点滴','てんてき']},
    {id:uid(),word:'静脈ライン',cat:'med',patterns:['静脈ライン','静脈ライン挿入','静脈ラン']},
    {id:uid(),word:'脊椎麻酔',  cat:'med',patterns:['脊椎麻酔','せきついますい','脊髄麻酔']},
    {id:uid(),word:'気道確保',  cat:'med',patterns:['気道確保','きどうかくほ']},
    {id:uid(),word:'記録',      cat:'rec',patterns:['記録','きろく']},
    {id:uid(),word:'保存',      cat:'rec',patterns:['保存','ほぞん']},
    {id:uid(),word:'開始',      cat:'rec',patterns:['開始','かいし','スタート']},
    {id:uid(),word:'終了',      cat:'rec',patterns:['終了','しゅうりょう','エンド']},
  ];
}

// ─── STATE ────────────────────────────────────────────
var words     = loadWords();
var ws        = null;
var recog     = null;
var isRec     = false;
var lastTxt   = '';
var matchMode = localStorage.getItem('matchMode') || 'partial';

function loadWords(){
  try{
    var s = localStorage.getItem('medwords_v3');
    if(s){ var d=JSON.parse(s); if(Array.isArray(d) && d.length>0) return d; }
  }catch(e){}
  return makeDefaultWords();
}
function saveWords(){ localStorage.setItem('medwords_v3', JSON.stringify(words)); }

// ─── TABS ─────────────────────────────────────────────
function showTab(name){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('page-'+name).classList.add('active');
  var idx = {home:0, words:1, settings:2}[name];
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  if(name==='words')    renderWords();
  if(name==='settings') initSettings();
}

// ─── WORD RENDERING ───────────────────────────────────
function renderWords(){
  ['med','rec'].forEach(function(cat){
    var el   = document.getElementById('list-'+cat);
    var list = words.filter(function(w){ return w.cat===cat; });
    if(!list.length){ el.innerHTML='<div class="empty-note">ワードがありません</div>'; return; }
    el.innerHTML = list.map(function(w){ return renderWordCard(w); }).join('');
  });
}

function renderWordCard(w){
  var pChips = (w.patterns||[]).map(function(p, pi){
    var isMain = (p === w.word);
    if(isMain){
      return '<div class="pattern-chip"><span class="main-chip">送信</span><span>'+esc(p)+'</span></div>';
    } else {
      return '<div class="pattern-chip"><span>'+esc(p)+'</span>'
        +'<button class="del-pat-btn" onclick="delPattern(\''+w.id+'\','+pi+')">✕</button></div>';
    }
  }).join('');

  return '<div class="word-card" id="wcard-'+w.id+'">'
    +'<div class="word-card-header" id="whdr-'+w.id+'" onclick="toggleCard(\''+w.id+'\')">'
    +'<span class="wch-name">'+esc(w.word)+'</span>'
    +'<span class="cat-badge'+(w.cat==='rec'?' rec':'')+'">'+( w.cat==='med'?'医療':'記録')+'</span>'
    +'<button class="del-word-btn" onclick="delWord(\''+w.id+'\',event)">🗑</button>'
    +'<span class="toggle-icon" id="tico-'+w.id+'">▼</span>'
    +'</div>'
    +'<div class="pattern-area" id="parea-'+w.id+'">'
    +'<div class="pattern-label">認識パターン（これらを拾ったら「'+esc(w.word)+'」を送信）</div>'
    +'<div class="pattern-list" id="plist-'+w.id+'">'+pChips+'</div>'
    +'<div class="pattern-add-row">'
    +'<input class="pattern-input" id="pinput-'+w.id+'" type="text" placeholder="誤変換パターンを追加" maxlength="30">'
    +'<button class="btn-xs" onclick="addPattern(\''+w.id+'\')">＋</button>'
    +'</div></div></div>';
}

function toggleCard(id){
  var area = document.getElementById('parea-'+id);
  var icon = document.getElementById('tico-'+id);
  var isOpen = area.classList.contains('open');
  if(isOpen){
    area.classList.remove('open');
    icon.classList.remove('open');
  } else {
    area.classList.add('open');
    icon.classList.add('open');
  }
}

function addWord(){
  var inp = document.getElementById('new-word');
  var cat = document.getElementById('new-cat').value;
  var w   = inp.value.trim();
  if(!w) return;
  var dup = words.some(function(x){ return x.word===w; });
  if(dup){ flashEl(inp); return; }
  words.push({id:uid(), word:w, cat:cat, patterns:[w]});
  saveWords(); inp.value=''; renderWords();
}

function delWord(id, e){
  e.stopPropagation();
  var w = words.filter(function(x){ return x.id===id; })[0];
  if(!w || !confirm('「'+w.word+'」を削除しますか？')) return;
  words = words.filter(function(x){ return x.id!==id; });
  saveWords(); renderWords();
}

function addPattern(id){
  var inp = document.getElementById('pinput-'+id);
  var val = inp.value.trim();
  if(!val) return;
  var w = words.filter(function(x){ return x.id===id; })[0];
  if(!w) return;
  if(w.patterns.indexOf(val) >= 0){ flashEl(inp); return; }
  w.patterns.push(val);
  saveWords();
  refreshPatternList(w);
  inp.value='';
}

function delPattern(id, pi){
  var w = words.filter(function(x){ return x.id===id; })[0];
  if(!w) return;
  if(w.patterns[pi]===w.word){ alert('送信ワード本体は削除できません'); return; }
  w.patterns.splice(pi,1);
  saveWords();
  refreshPatternList(w);
}

function refreshPatternList(w){
  var el = document.getElementById('plist-'+w.id);
  if(!el) return;
  el.innerHTML = (w.patterns||[]).map(function(p,pi){
    var isMain = (p === w.word);
    if(isMain){
      return '<div class="pattern-chip"><span class="main-chip">送信</span><span>'+esc(p)+'</span></div>';
    } else {
      return '<div class="pattern-chip"><span>'+esc(p)+'</span>'
        +'<button class="del-pat-btn" onclick="delPattern(\''+w.id+'\','+pi+')">✕</button></div>';
    }
  }).join('');
}

function resetWords(){
  if(!confirm('全ワードをデフォルトに戻しますか？')) return;
  words = makeDefaultWords();
  saveWords(); renderWords();
}

function exportData(){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(words,null,2)],{type:'application/json'}));
  a.download = 'medvoice_words.json';
  a.click();
}
function importClick(){ document.getElementById('import-file').click(); }
function importData(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    try{
      var d = JSON.parse(ev.target.result);
      if(!Array.isArray(d)) throw 0;
      words = d; saveWords(); renderWords(); alert('インポート完了');
    }catch(err){ alert('形式エラー'); }
  };
  r.readAsText(f);
}

// ─── SETTINGS ─────────────────────────────────────────
function initSettings(){
  var sel = document.getElementById('match-mode');
  sel.value = matchMode;
  sel.onchange = function(e){ matchMode=e.target.value; localStorage.setItem('matchMode',matchMode); };
}

// ─── MATCHING ─────────────────────────────────────────
function matchWord(transcript){
  var t = transcript.trim();
  var best = null;
  var bestLen = 0;
  for(var i=0;i<words.length;i++){
    var w = words[i];
    var pats = w.patterns || [];
    for(var j=0;j<pats.length;j++){
      var pat = pats[j];
      var hit = false;
      if(matchMode==='exact'){
        hit = (t === pat);
      } else {
        hit = (t.indexOf(pat) >= 0);
      }
      if(hit && pat.length > bestLen){
        best = w;
        bestLen = pat.length;
      }
    }
  }
  return best;
}

// ─── WEBSOCKET ────────────────────────────────────────
function connectWS(){
  var url = document.getElementById('ws-input').value.trim();
  if(!url){ flashEl(document.getElementById('ws-input')); return; }
  if(ws) ws.close();
  setStatus('','接続中…');
  ws = new WebSocket(url);
  ws.onopen  = function(){ setStatus('on','接続中'); addLog('SYS','接続OK','ok'); localStorage.setItem('ws_url',url); };
  ws.onclose = function(){ setStatus('','切断'); addLog('SYS','切断','ng'); };
  ws.onerror = function(){ addLog('SYS','エラー','ng'); };
}
function setStatus(cls,txt){
  document.getElementById('status-dot').className = cls;
  document.getElementById('status-txt').textContent = txt;
}
function sendWord(w){
  if(!ws || ws.readyState!==WebSocket.OPEN){ addLog(w,'未接続','ng'); showFB('⚠ 未接続','var(--danger)'); return; }
  ws.send(w);
  addLog(w,'送信OK','ok');
  showFB('✓  '+w+'  送信','var(--green)');
}

// ─── SPEECH ───────────────────────────────────────────
function recStart(e){
  e.preventDefault();
  if(isRec) return;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('音声認識非対応\niOS Safariを使ってください'); return; }
  recog = new SR();
  recog.lang = 'ja-JP';
  recog.interimResults = true;
  recog.maxAlternatives = 3;
  recog.continuous = true;
  recog.onstart = function(){
    isRec=true; lastTxt='';
    document.getElementById('mic-btn').classList.add('rec');
    document.getElementById('waveform').classList.add('active');
    document.getElementById('transcript-box').classList.add('active');
    document.getElementById('mic-lbl').textContent='REC';
    document.getElementById('mic-icon').textContent='⏹';
    setTxt('','interim');
  };
  recog.onresult = function(ev){
    var interim='', final='';
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal) final+=t; else interim+=t;
    }
    var cur = (final||interim).trim();
    if(cur) lastTxt=cur;
    var hit = matchWord(cur);
    setTxt(cur, hit?'matched':'interim');
  };
  recog.onerror = function(ev){ addLog('MIC',ev.error,'ng'); };
  recog.onend   = function(){ if(isRec) stopAndJudge(); };
  recog.start();
}

function recStop(e){
  if(!isRec) return;
  e.preventDefault();
  stopAndJudge();
}

function stopAndJudge(){
  isRec=false;
  if(recog){ try{ recog.stop(); }catch(e){} recog=null; }
  document.getElementById('mic-btn').classList.remove('rec');
  document.getElementById('waveform').classList.remove('active');
  document.getElementById('transcript-box').classList.remove('active');
  document.getElementById('mic-lbl').textContent='HOLD';
  document.getElementById('mic-icon').textContent='🎤';
  if(!lastTxt){ setTxt('',''); return; }
  var hit = matchWord(lastTxt);
  if(hit){
    setTxt(hit.word,'matched');
    sendWord(hit.word);
  } else {
    setTxt(lastTxt,'nomatch');
    showFB('✗ 一致なし — ワードタブでパターン追加できます','var(--danger)');
    addLog(lastTxt,'不一致','ng');
  }
}

function setTxt(t,mode){
  var el = document.getElementById('transcript-txt');
  el.className='';
  if(!t){ el.textContent='長押しで録音開始'; el.classList.add('ph'); }
  else  { el.textContent=t; if(mode) el.classList.add(mode); }
}

// ─── UI HELPERS ───────────────────────────────────────
function showFB(msg,color){
  var el = document.getElementById('feedback');
  el.textContent=msg; el.style.color=color; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 2500);
}
function addLog(word,status,type){
  var log = document.getElementById('log');
  var now = new Date();
  var t = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  var row = document.createElement('div');
  row.className='log-row';
  row.innerHTML='<span class="lt">'+t+'</span><span class="lw">'+esc(word)+'</span><span class="ls-'+type+'">'+esc(status)+'</span>';
  log.insertBefore(row, log.firstChild);
  while(log.children.length>25) log.removeChild(log.lastChild);
}

// ─── INIT ─────────────────────────────────────────────
window.onload = function(){
  var s = localStorage.getItem('ws_url');
  if(s) document.getElementById('ws-input').value=s;
  document.getElementById('new-word').addEventListener('keydown', function(e){
    if(e.key==='Enter') addWord();
  });
};
</script>
